name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd ~/base580-backend
            git fetch origin main
            git reset --hard origin/main
            sudo docker network inspect base580-net >/dev/null 2>&1 || sudo docker network create base580-net
            sudo docker build -t base580-backend:latest .
            sudo docker stop base580-backend >/dev/null 2>&1 || true
            sudo docker rm base580-backend >/dev/null 2>&1 || true
            sudo docker run -d \
              --name base580-backend \
              --restart unless-stopped \
              --network base580-net \
              -p 8080:8080 \
              -e SERVER_PORT=8080 \
              -e SPRING_DATA_MONGODB_URI='mongodb://base580-mongo:27017/base580' \
              base580-backend:latest
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null; then
                break
              fi
              sleep 2
            done
            curl -fsS http://localhost:8080/actuator/health
